<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会话回复 · HumanChatApi</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--line:#2a2f3a;--text:#e8eaf0;--muted:#8b93a3;--acc:#4f8cff;--ok:#3ecf8e;--err:#ff5b5b;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.top{position:sticky;top:0;background:rgba(15,17,21,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:16px;z-index:5}
.top a{color:var(--acc);font-size:14px;text-decoration:none}
.top .sid{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.top .logo{width:26px;height:26px;border-radius:6px;object-fit:contain}
.top .status-badge{font-size:12px;padding:3px 12px;border-radius:20px}
.top .status-badge.waiting{background:rgba(255,176,32,.15);color:var(--warn);border:1px solid rgba(255,176,32,.3)}
.top .status-badge.completed{background:rgba(62,207,142,.15);color:var(--ok);border:1px solid rgba(62,207,142,.3)}
.wrap{max-width:820px;margin:24px auto 60px;padding:0 18px}
.msg{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;background:var(--card)}
.msg .role{display:inline-block;font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;margin-bottom:12px}
.msg .role.user{background:rgba(79,140,255,.15);color:var(--acc)}
.msg .role.assistant{background:rgba(62,207,142,.15);color:var(--ok)}
.msg .role.system{background:rgba(139,147,163,.15);color:var(--muted)}
.block{margin-bottom:14px}
.block:last-child{margin-bottom:0}
.block.text{font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.block.img img{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.img-meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.reply{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:10px}
.reply h3{font-size:16px;margin-bottom:12px}
textarea{width:100%;min-height:130px;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:14px;font-size:15px;line-height:1.6;resize:vertical;font-family:inherit}
textarea:focus{outline:none;border-color:var(--acc)}
.actions{display:flex;gap:12px;margin-top:16px;align-items:center;flex-wrap:wrap}
button{padding:12px 26px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.btn-submit{background:var(--acc);color:#fff}
.btn-submit:hover{filter:brightness(1.1)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.btn-close{background:transparent;color:var(--err);border:1px solid var(--err)}
.btn-close:hover{background:rgba(255,91,91,.1)}
.hint{color:var(--muted);font-size:13px}
.status{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1b2430;border:1px solid var(--ok);color:var(--ok);padding:12px 24px;border-radius:12px;opacity:0;transition:.3s;font-size:14px;z-index:9}
.status.show{opacity:1;transform:translateX(-50%)}
.replied-note{background:rgba(62,207,142,.08);border:1px solid rgba(62,207,142,.3);color:var(--ok);border-radius:14px;padding:14px 18px;margin-bottom:14px;font-size:14px}
.msg.folded{background:var(--card2);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.msg.folded.clickable{cursor:pointer;transition:.15s}
.msg.folded.clickable:hover{border-color:var(--acc);transform:translateY(-1px)}
.msg.folded .fold-hint{font-size:13px;color:var(--muted);flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.folded .fold-arrow{font-size:12px;color:var(--acc);white-space:nowrap}
/* 提示词和上下文合并折叠按钮 */
.ctx-folded{background:rgba(79,140,255,.08);border:1px dashed rgba(79,140,255,.4);border-radius:14px;padding:16px 20px;margin-bottom:14px;text-align:center;font-size:15px;color:var(--acc);cursor:pointer;transition:.15s}
.ctx-folded:hover{background:rgba(79,140,255,.15);transform:translateY(-1px)}
/* 底部固定操作栏 */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 24px;z-index:10;display:flex;flex-direction:column;gap:10px}
.bottom-bar .reply{margin-top:0;border:none;padding:0;background:transparent}
.bottom-bar .reply h3{display:none}
.bottom-bar textarea{min-height:80px;max-height:160px}
.bottom-bar .bottom-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
body{padding-bottom:180px}
</style>
</head>
<body>
<div class="top">
  <a href="/admin">← 返回首页</a>
  <img src="/webui/HumanChatApi.png" alt="logo" class="logo">
  <span class="sid">__SID__</span>
  __STATUS_BADGE__
</div>
<div class="wrap">
  __REPLIED_NOTE__

  __HISTORY__
</div>

<!-- 底部固定操作栏：回复输入 + 关闭会话，不受长上下文影响 -->
<div class="bottom-bar">
  __REPLY_FORM__
  <div class="bottom-actions">
    <button class="btn-close" id="btnClose">🗑 关闭会话（从后台删除）</button>
    <span class="hint">关闭后会话从内存中移除，不可恢复。</span>
  </div>
</div>
<div class="status" id="status"></div>

<script>
var sid = "__SID__";

function show(text, type){
  var s=document.getElementById('status');
  s.textContent=text;
  if(type==='err'){s.style.borderColor='var(--err)';s.style.color='var(--err)';}
  else{s.style.borderColor='var(--ok)';s.style.color='var(--ok)';}
  s.classList.add('show');
  setTimeout(function(){s.classList.remove('show');},2500);
}

var btnSubmit=document.getElementById('btnSubmit');
if(btnSubmit){
  btnSubmit.addEventListener('click', function(){
    var box=document.getElementById('replyBox');
    var content=box.value.trim();
    if(!content){box.focus();return;}
    btnSubmit.disabled=true;
    var xhr=new XMLHttpRequest();
    xhr.open('POST','/admin/submit');
    xhr.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
    xhr.onload=function(){
      try{
        var data=JSON.parse(xhr.responseText);
        if(data.ok){
          show('✅ 已提交！回复已发送给客户端，会话保留在后台。');
          setTimeout(function(){location.href='/admin';},1200);
        }else{
          show('❌ '+data.error,'err');
          btnSubmit.disabled=false;
        }
      }catch(e){
        show('❌ 提交失败，请重试','err');
        btnSubmit.disabled=false;
      }
    };
    xhr.onerror=function(){show('❌ 提交失败，请重试','err');btnSubmit.disabled=false;};
    xhr.send('sid='+encodeURIComponent(sid)+'&reply_content='+encodeURIComponent(content));
  });
}

document.getElementById('btnClose').addEventListener('click', function(){
  if(!confirm('确定关闭该会话？关闭后将从后台删除，不可恢复。')) return;
  var xhr=new XMLHttpRequest();
  xhr.open('POST','/admin/close');
  xhr.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
  xhr.onload=function(){
    try{
      var data=JSON.parse(xhr.responseText);
      if(data.ok){
        show('🗑 会话已关闭并删除');
        setTimeout(function(){location.href='/admin';},1000);
      }else{
        show('❌ '+data.error,'err');
      }
    }catch(e){ show('❌ 关闭失败，请重试','err'); }
  };
  xhr.onerror=function(){show('❌ 关闭失败，请重试','err');};
  xhr.send('sid='+encodeURIComponent(sid));
});
</script>
</body>
</html>
