<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消息详情 · HumanChatApi</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--line:#2a2f3a;--text:#e8eaf0;--muted:#8b93a3;--acc:#4f8cff;--ok:#3ecf8e;--err:#ff5b5b;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.top{position:sticky;top:0;background:rgba(15,17,21,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:16px;z-index:5}
.top a{color:var(--acc);font-size:14px;text-decoration:none}
.top .logo{width:26px;height:26px;border-radius:6px;object-fit:contain}
.top .sid{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.top .pos-badge{font-size:12px;padding:3px 12px;border-radius:20px;background:rgba(79,140,255,.15);color:var(--acc);border:1px solid rgba(79,140,255,.3)}
.wrap{max-width:820px;margin:30px auto 60px;padding:0 18px}
.msg{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--card)}
.msg .role{display:inline-block;font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;margin-bottom:12px}
.msg .role.user{background:rgba(79,140,255,.15);color:var(--acc)}
.msg .role.assistant{background:rgba(62,207,142,.15);color:var(--ok)}
.msg .role.system{background:rgba(139,147,163,.15);color:var(--muted)}
.block{margin-bottom:14px}
.block:last-child{margin-bottom:0}
.block.text{font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.block.img img{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.img-meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:20px}
details.msg summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;user-select:none;-webkit-user-select:none}
details.msg summary::-webkit-details-marker{display:none}
details.msg summary .fold-hint{font-size:13px;color:var(--acc)}
details.msg summary:hover .fold-hint{text-decoration:underline}
details.msg[open] summary .fold-hint{display:none}
details.msg[open] .block{margin-top:14px}
</style>
</head>
<body>
<div class="top">
  <a href="/admin/chat?sid=__SID__">← 返回会话</a>
  <img src="/webui/HumanChatApi.png" alt="logo" class="logo">
  <span class="sid">__SID__</span>
  <span class="pos-badge">消息 __IDX__ / __TOTAL__</span>
</div>

<div class="wrap">
  <!-- 默认折叠，点击展开才显示完整内容 -->
  <details class="msg">
    <summary>
      <span class="role __ROLE_CLS__">__ROLE_LABEL__</span>
      <span class="fold-hint">▸ 点击展开查看完整内容</span>
    </summary>
    __CONTENT__
  </details>

  <div class="hint">内容默认折叠，点击上方「▸ 点击展开查看完整内容」展开</div>
</div>
</body>
</html>
